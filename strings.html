<!--This is the HTML structure for the palindrone checker webpage-->
<!DOCTYPE html>
<html lang="en">

<head>

            /*Set a dark text <color></color>*/
             color: #007acc;
             /*Add some space below the heading*/
                margin-bottom: 20px;
        }
        /*Style the button that starts the palindrone check*/
        button {

        /*Style the small note that shows the result*/
        .note{
            /*Set a medium text size*/

</head>
<!--Start the body where the visible content is-->
<body>

    <div class="container">
        <!--Main heading of the page-->
        <h1>Palindrone Checker</h1>
        <!--Input field for user to enter a string-->

        <!--Button to trigger the palindrone check-->
        <button onclick="checkPalindrome()">Check Palindrone</button>
        <!--Div to display the result of the check-->
        <div id="result" class="note"></div>
    </div>

    <!--JavaScript function to check if the input string is a palindrone-->
    <script>
        function checkPalindrome() {
            //split the input string into characters, reverse the array, and join it back into a string
            let cleanedInput = userInput.replace(/[\W_]/g, '').toLowerCase();
            let reversedInput = cleanedInput.split('').reverse().join('');
            //Compare the cleaned input with the reversed input

    </script>
